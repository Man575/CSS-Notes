<!DOCTYPE html>
<html>
<head>
<style>
* {
  text-align: center;
  color: blue;
}
</style>
</head>
<body>
<pre id="notes" style="background-color: black; color: white; text-align: left;"></pre>
<h1>Hello world!</h1>
<p>Every element on the page will be affected by the style.</p>
<p id="para1">Me too!</p>
<p>And me!</p>

<script>
let slct=document.getElementById("notes");
slct.textContent=`<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                text-align: center;
                color: blue;
            }
        </style>
    </head>
    <body>

        <h1>Hello world!</h1>
        <p>Every element on the page will be affected by the style.</p>
        <p id="para1">Me too!</p>
        <p>And me!</p>

    </body>
</html>`
</script>
</body>
</html>
